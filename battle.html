<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Redirect — Waifu Math Clash</title>
  <link rel="stylesheet" href="css/style.css">
  <meta http-equiv="refresh" content="0; url=game-casual.html">
  <script>
    // Redirect kompatibilitas: battle.html -> game-casual.html (preserve ?id & hash)
    (function(){
      var qs = location.search || '';
      var hash = location.hash || '';
      var target = 'game-casual.html' + qs + hash;
      // replace agar back button tidak terjebak loop
      location.replace(target);
    })();
  </script>
</head>
<body style="display:flex; align-items:center; justify-content:center; height:100vh; background: var(--bg);">
  <div style="text-align:center; padding:2rem;">
    <div class="spinner" style="margin:0 auto;"></div>
    <p style="margin-top:1rem; color: var(--teks-sekunder); font-weight:700;">Mengalihkan ke Game Casual…</p>
    <p style="margin-top:0.5rem;"><a href="game-casual.html" style="color: var(--primary); font-weight:800;">Tap di sini jika tidak otomatis</a></p>
  </div>
</body>
</html>
