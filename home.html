<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Home — Waifu Math Clash</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    #bg-waifu {
      position: fixed;
      inset: -5%;
      background-size: cover;
      background-position: center;
      background-color: var(--bg);
      transition: transform 0.15s ease-out;
      transform: scale(1.1);
      z-index: 0;
    }
    #dim-overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.55) 0%,
        rgba(0,0,0,0.2) 40%,
        rgba(0,0,0,0.6) 100%
      );
      z-index: 1;
    }
    .header-home {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      padding: 1rem 1.25rem 0.75rem;
    }
    .teks-shadow {
      text-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }
    #nama-game-tengah {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Background waifu favorit -->
  <div id="bg-waifu"></div>
  <div id="dim-overlay" class="hidden"></div>

  <!-- Nama game jika belum ada waifu favorit -->
  <div id="nama-game-tengah">
    <h1 class="text-4xl font-extrabold" style="color: var(--primary);">Waifu Math Clash</h1>
    <p class="text-sm mt-1" style="color: var(--teks-sekunder);">Pilih kartu, jawab soal, menang!</p>
  </div>

  <!-- Header atas -->
  <div class="header-home">
    <div class="flex justify-between items-center">
      <div>
        <span id="txt-username" class="text-white font-extrabold text-base teks-shadow">...</span>
        <span id="txt-rank" class="text-white font-bold text-sm teks-shadow ml-2">Rank ...</span>
      </div>
      <div class="flex gap-3">
        <span id="txt-silver" class="text-white font-semibold text-sm teks-shadow"><img src="assets/ui/icon_key_silver.svg" alt="key" style="width:1em;height:1em;vertical-align:middle;display:inline;"> ...</span>
        <span id="txt-gold" class="text-white font-semibold text-sm teks-shadow"><img src="assets/ui/icon_key_gold.svg" alt="key" style="width:1em;height:1em;vertical-align:middle;display:inline;"> ...</span>
      </div>
    </div>
  </div>

  <!-- Bottom Navigation — 6 menu -->
  <nav class="bottom-nav">
    <a href="home.html" class="aktif">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Home
    </a>
    <a href="gacha.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
      Gacha
    </a>
    <a href="collection.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="9" rx="2"/><rect x="3" y="15" width="7" height="6" rx="2"/><rect x="14" y="15" width="7" height="6" rx="2"/></svg>
      Koleksi
    </a>
    <a href="battle.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      Battle
    </a>
    <a href="shop.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
      Shop
    </a>
    <a href="profil.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Profil
    </a>
  </nav>

  <!-- Modal Daily Login -->
  <div id="modal-login-harian" class="modal-overlay hidden">
    <div class="modal-box text-center">
      <div class="text-4xl mb-2"><img src="assets/ui/icon_gift.svg" alt="gift" style="width:1em;height:1em;vertical-align:middle;display:inline;"></div>
      <h3 class="modal-judul">Daily Login!</h3>
      <p class="text-sm mb-1" style="color: var(--teks-sekunder);">Reward hari ini:</p>
      <p id="reward-login-teks" class="text-2xl font-extrabold mb-4" style="color: var(--primary);">+1 <img src="assets/ui/icon_key_silver.svg" alt="key" style="width:1em;height:1em;vertical-align:middle;display:inline;"> Key Silver</p>
      <button id="btn-claim-login" class="btn-utama">Claim!</button>
    </div>
  </div>

  <!-- Modal Daily Quest -->
  <div id="modal-quest-harian" class="modal-overlay hidden">
    <div class="modal-box">
      <h3 class="modal-judul">Daily Quest</h3>
      <p class="text-xs text-center mb-3" style="color: var(--teks-sekunder);">Jawab soal benar → +2 <img src="assets/ui/icon_key_silver.svg" alt="key" style="width:1em;height:1em;vertical-align:middle;display:inline;"> Key Silver</p>

      <!-- Timer bar quest -->
      <div class="timer-bar-wrap mb-2">
        <div id="quest-timer-bar" class="timer-bar-fill" style="width: 100%;"></div>
      </div>
      <p id="quest-timer-teks" class="text-center text-sm font-bold mb-3" style="color: var(--aksen);">60 detik</p>

      <!-- Soal -->
      <p id="quest-soal" class="text-center text-xl font-extrabold mb-4" style="color: var(--teks);">Memuat soal...</p>

      <!-- 4 opsi jawaban -->
      <div id="quest-opsi" class="grid grid-cols-2 gap-2"></div>

      <!-- Hasil quest -->
      <p id="quest-hasil" class="text-center font-bold mt-3 hidden"></p>
      <button id="btn-tutup-quest" class="btn-utama mt-3 hidden">Lanjut</button>
    </div>
  </div>

  <script type="module" src="js/home.js"></script>
</body>
</html>
