<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Profil — Waifu Math Clash</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header -->
  <div class="header-fix">
    <h2 class="text-lg font-extrabold" style="color: var(--teks);">Profil</h2>
  </div>

  <!-- Konten scrollable -->
  <div class="konten-halaman ada-header scrollable px-4 pt-4 pb-6">

    <!-- Info utama player -->
    <div class="bg-white rounded-3xl shadow-md p-5 mb-4 text-center">
      <div class="w-20 h-20 rounded-full mx-auto mb-3 flex items-center justify-center text-4xl" style="background: var(--bg);"><img src="assets/ui/icon_sakura.svg" alt="sakura" style="width:1em;height:1em;vertical-align:middle;display:inline;"></div>
      <p id="profil-username" class="text-xl font-extrabold mb-1" style="color: var(--teks);">...</p>
      <div id="profil-rank" class="inline-block px-4 py-1 rounded-full font-bold text-sm mb-2" style="background: var(--primary); color: #fff;">Rank ...</div>
      <p id="profil-power" class="text-sm" style="color: var(--teks-sekunder);">Total Power: ...</p>
    </div>

    <!-- Statistik -->
    <div class="bg-white rounded-3xl shadow-md p-5 mb-4">
      <h3 class="font-extrabold text-base mb-3" style="color: var(--teks);">Statistik</h3>
      <div class="space-y-2">
        <div class="flex justify-between items-center">
          <span class="text-sm" style="color: var(--teks-sekunder);">Menang</span>
          <span id="stat-menang" class="font-bold" style="color: var(--primary);">-</span>
        </div>
        <div class="flex justify-between items-center">
          <span class="text-sm" style="color: var(--teks-sekunder);">Kalah</span>
          <span id="stat-kalah" class="font-bold" style="color: var(--aksen);">-</span>
        </div>
        <div class="flex justify-between items-center">
          <span class="text-sm" style="color: var(--teks-sekunder);">Winrate</span>
          <span id="stat-winrate" class="font-bold" style="color: var(--teks);">-</span>
        </div>
        <hr style="border-color: #f0f0f0;">
        <div class="flex justify-between items-center">
          <span class="text-sm" style="color: var(--teks-sekunder);">Total Gacha</span>
          <span id="stat-gacha" class="font-bold" style="color: var(--teks);">-</span>
        </div>
        <div class="flex justify-between items-center">
          <span class="text-sm" style="color: var(--teks-sekunder);">Total Kartu</span>
          <span id="stat-kartu" class="font-bold" style="color: var(--teks);">-</span>
        </div>
        <div class="flex justify-between items-center">
          <span class="text-sm" style="color: var(--teks-sekunder);">Banner Favorit</span>
          <span id="stat-banner" class="font-bold" style="color: var(--teks);">-</span>
        </div>
      </div>
    </div>

    <!-- Setting -->
    <div class="bg-white rounded-3xl shadow-md p-5 mb-4">
      <h3 class="font-extrabold text-base mb-3" style="color: var(--teks);">Setting</h3>
      <div class="space-y-3">
        <button id="btn-ubah-username" class="btn-outline text-left flex items-center gap-2" style="justify-content: flex-start;">
          <span><img src="assets/ui/icon_pencil.svg" alt="pencil" style="width:1em;height:1em;vertical-align:middle;display:inline;"></span> Ubah Username
        </button>
        <button id="btn-ubah-password" class="btn-outline text-left flex items-center gap-2" style="justify-content: flex-start;">
          <span><img src="assets/ui/icon_padlock.svg" alt="padlock" style="width:1em;height:1em;vertical-align:middle;display:inline;"></span> Ubah Password
        </button>
      </div>
    </div>

    <!-- Logout -->
    <button id="btn-logout" class="btn-aksen">Logout</button>

  </div>

  <!-- Bottom Navigation — 6 menu -->
  <nav class="bottom-nav">
    <a href="home.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Home
    </a>
    <a href="gacha.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
      Gacha
    </a>
    <a href="collection.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="9" rx="2"/><rect x="3" y="15" width="7" height="6" rx="2"/><rect x="14" y="15" width="7" height="6" rx="2"/></svg>
      Koleksi
    </a>
    <a href="minigame.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="6"/><path d="M6 12h4"/><path d="M8 10v4"/><circle cx="15" cy="11" r="1" fill="currentColor" stroke="none"/><circle cx="17" cy="13" r="1" fill="currentColor" stroke="none"/></svg>
      Minigame
    </a>
    <a href="shop.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
      Shop
    </a>
    <a href="profil.html" class="aktif">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Profil
    </a>
  </nav>

  <!-- Modal Ubah Username -->
  <div id="modal-username" class="modal-overlay hidden">
    <div class="modal-box">
      <h3 class="modal-judul">Ubah Username</h3>
      <input id="input-username-baru" type="text" class="input-field mb-2" placeholder="Username baru">
      <p id="error-username" class="teks-error mb-2 hidden"></p>
      <button id="btn-simpan-username" class="btn-utama mb-2">Simpan</button>
      <button id="btn-batal-username" class="btn-outline">Batal</button>
    </div>
  </div>

  <!-- Modal Ubah Password -->
  <div id="modal-password" class="modal-overlay hidden">
    <div class="modal-box">
      <h3 class="modal-judul">Ubah Password</h3>
      <input id="input-password-lama" type="password" class="input-field mb-2" placeholder="Password lama">
      <input id="input-password-baru" type="password" class="input-field mb-2" placeholder="Password baru">
      <input id="input-password-konfirm" type="password" class="input-field mb-2" placeholder="Konfirmasi password baru">
      <p id="error-password" class="teks-error mb-2 hidden"></p>
      <button id="btn-simpan-password" class="btn-utama mb-2">Simpan</button>
      <button id="btn-batal-password" class="btn-outline">Batal</button>
    </div>
  </div>

  <script type="module" src="js/profil.js"></script>
</body>
</html>
