<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Waifu Math Clash</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#EDFCF6; --primary:#3EC99E; --teks:#2E3A35; --teks-sekunder:#85A89E; }
    * { box-sizing:border-box; font-family:'Nunito',sans-serif; }
    body { margin:0; height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--teks); text-align:center; padding:24px; }
    .card { background:#fff; border-radius:24px; padding:28px 20px; width:100%; max-width:360px; box-shadow:0 8px 32px rgba(62,201,158,0.15); }
    .icon { width:64px; height:64px; border-radius:18px; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-size:28px; margin:0 auto 14px; }
    h1 { margin:0 0 6px; font-size:20px; font-weight:900; }
    p { margin:0; color:var(--teks-sekunder); font-size:13px; line-height:1.5; }
    .spinner { width:36px; height:36px; border:4px solid #e6f5f0; border-top-color:var(--primary); border-radius:50%; animation:spin 0.8s linear infinite; margin:16px auto 0; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🌸</div>
    <h1>Waifu Math Clash</h1>
    <p>Memuat game… Jika lama, cek koneksi internet kamu.</p>
    <div class="spinner"></div>
    <p style="margin-top:12px; font-size:12px; opacity:0.6;">Portrait only • Back 2x untuk keluar</p>
  </div>
  <script src="./js/app.js"></script>
</body>
</html>
